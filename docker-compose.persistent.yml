version: '3.8'

services:
  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  cloud-drive:
    build: .
    container_name: cloud_drive_app
    ports:
      - "5001:5000"
    volumes:
      - ./data/encrypted:/data/encrypted
      - ./data/temp:/data/temp
    environment:
      - FLASK_HOST=0.0.0.0
      - UPLOAD_FOLDER=/data/encrypted
      - TEMP_FOLDER=/data/temp
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - see .env.example}
    restart: unless-stopped
    networks:
      - cloud_drive_network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # nosemgrep: yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_persistent
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared_config:/etc/cloudflared:ro
    networks:
      - cloud_drive_network
    depends_on:
      cloud-drive:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  cloud_drive_network:
    driver: bridge
