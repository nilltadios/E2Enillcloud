<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: #111111;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.1);
            border: 1px solid #333;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #ff0000;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #bbbbbb;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #222222;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b30000 0%, #660000 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, box-shadow 0.3s;
        }
        button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }
        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        .message.error {
            background: #2c0b0e;
            color: #ff4444;
            border: 1px solid #8B0000;
        }
        .message.success {
            background: #0e2c15;
            color: #00cc00;
            border: 1px solid #006400;
        }
        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .link-text a {
            color: #ff4444;
            text-decoration: none;
            font-weight: 600;
        }
        .link-text a:hover {
            text-decoration: underline;
        }
        .lock-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">🔒</div>
        <h1>Cloud Drive Login</h1>
        <div id="message" class="message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="link-text">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        // Security: Fetch CSRF token for secure requests
        let csrfToken = null;
        async function getCsrfToken() {
            if (!csrfToken) {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                csrfToken = data.csrf_token;
            }
            return csrfToken;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const token = await getCsrfToken();
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': token
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = 'Login successful! Redirecting...';
                    messageDiv.style.display = 'block';

                    setTimeout(() => {
                        // Always pass password via URL fragment (not sent to server)
                        // sessionStorage can fail on navigation in some browsers
                        window.location.href = '/dashboard#epw=' + encodeURIComponent(btoa(password));
                    }, 1000);
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.message || 'Login failed';
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'An error occurred';
                messageDiv.style.display = 'block';
            }
        });

    </script>
</body>
</html>
